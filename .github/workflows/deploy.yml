name: Deploy CodeShift to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Only job: Build & push to gh-pages branch. This is the reliable method.
  deploy-gh-pages-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Clean Distribution
        run: |
          mkdir -p dist
          cp index.html dist/
          cp 404.html dist/
          cp app.js dist/
          cp styles.css dist/
          cp .nojekyll dist/
          cp README.md dist/
          cp -r public dist/
          cp -r brand dist/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true


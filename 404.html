<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeShift — Loading Room...</title>
  <meta name="description" content="Instant real-time collaborative code editor with zero login and client-side encryption.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://kaushalboii.github.io/codeshift/">
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <script>
    (function() {
      var path = window.location.pathname;
      var repoSegment = '/codeshift';
      var route = path;
      if (route.indexOf(repoSegment) === 0) {
        route = route.substring(repoSegment.length);
      }
      route = route.replace(/^\/+/, '');
      
      if (route && route !== 'index.html' && route !== '404.html') {
        sessionStorage.setItem('codeshift_room', route);
      }
      
      window.location.replace(window.location.origin + repoSegment + '/');
    })();
  </script>
</head>
<body style="background:#000000;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p style="font-size:14px;letter-spacing:0.04em;color:#888888;">Connecting to CodeShift...</p>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1A38"/>
      <stop offset="50%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>

    <!-- Electric Violet Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="45%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Shift Accent Gradient -->
    <linearGradient id="shiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B7CFF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B7CFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGlow)" stroke="#2D2F45" stroke-width="1.5"/>

  <!-- Subtle ambient inner highlight -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo Mark: The Code Bracket + Shift Arrow Fusion -->
  <g filter="url(#dropShadow)">
    <!-- Left Bracket < -->
    <path d="M42 38L24 60L42 82" stroke="url(#primaryGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M78 38L96 60L78 82" stroke="url(#primaryGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Upward Shift Chevron ⇧ / Forward Shift -->
    <path d="M60 34L48 50H55V76C55 78.2091 56.7909 80 59 80H61C63.2091 80 65 78.2091 65 76V50H72L60 34Z" 
          fill="url(#shiftGrad)"/>
          
    <!-- Core Energy Dot -->
    <circle cx="60" cy="56" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>


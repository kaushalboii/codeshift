<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="fullMarkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="shiftTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="60%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8B7CFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Logo Mark (Left 76x76) -->
  <g transform="translate(12, 12)" filter="url(#markGlow)">
    <!-- Squircle Background -->
    <rect width="76" height="76" rx="20" fill="#13141E" stroke="#2B2D42" stroke-width="1.5"/>
    <rect x="2" y="2" width="72" height="72" rx="18" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Left Bracket < -->
    <path d="M28 26L16 38L28 50" stroke="url(#fullMarkGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M48 26L60 38L48 50" stroke="url(#fullMarkGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Shift Arrow ⇧ -->
    <path d="M38 23L30 33H34.5V49C34.5 50.1 35.4 51 36.5 51H39.5C40.6 51 41.5 50.1 41.5 49V33H46L38 23Z" fill="url(#shiftTextGrad)"/>
    
    <circle cx="38" cy="37" r="1.5" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Wordmark: CodeShift -->
  <text x="108" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.03em" fill="#F8FAFC">
    Code<tspan fill="url(#shiftTextGrad)">Shift</tspan>
  </text>

  <!-- Live Pulse Pill -->
  <g transform="translate(315, 34)">
    <rect width="68" height="24" rx="12" fill="url(#badgeGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="14" cy="12" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="0.08em">LIVE</text>
  </g>
</svg>


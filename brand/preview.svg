<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02070a"/>
      <stop offset="50%" stop-color="#051217"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ce2ee"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Living 3D Wave Grid Simulation -->
  <g opacity="0.30" stroke="#ffffff" stroke-width="0.8" fill="none">
    <path d="M0,380 Q300,320 600,360 T1200,330"/>
    <path d="M0,400 Q300,340 600,380 T1200,350"/>
    <path d="M0,420 Q300,360 600,400 T1200,370"/>
    <path d="M0,440 Q300,385 600,425 T1200,395"/>
    <path d="M0,460 Q300,410 600,450 T1200,420"/>
    <path d="M0,480 Q300,435 600,475 T1200,445"/>
    <path d="M0,500 Q300,460 600,500 T1200,470"/>
    <path d="M0,520 Q300,485 600,525 T1200,495"/>
    <path d="M0,540 Q300,510 600,550 T1200,520"/>
    <path d="M0,560 Q300,535 600,575 T1200,545"/>
  </g>

  <!-- Ambient Backdrop Glow -->
  <circle cx="600" cy="180" r="140" fill="#ffffff" opacity="0.04" filter="url(#glow)"/>

  <!-- Top Navigation Simulation -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="26" height="26" rx="6" fill="#ffffff"/>
    <path d="M8 8L13 13L8 18" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="15" y1="18" x2="20" y2="18" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">CodeShift</text>
    
    <rect x="910" y="2" width="170" height="28" rx="14" fill="#111111" stroke="#333333"/>
    <text x="995" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">v2.0 · OPEN SOURCE</text>
  </g>

  <!-- Tagline Pill -->
  <g transform="translate(600, 115)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#111111" stroke="#333333" stroke-width="1"/>
    <circle cx="-135" cy="0" r="4" fill="#ffffff"/>
    <text x="-120" y="4" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">REAL-TIME CODE SHARING · NO LOGIN</text>
  </g>

  <!-- Headline -->
  <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Code Together.
  </text>
  <text x="600" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="46" font-weight="800" fill="#888888" text-anchor="middle" letter-spacing="-1">
    Anywhere. Instantly.
  </text>

  <!-- Subtitle -->
  <text x="600" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#888888" text-anchor="middle">
    Open a room, share the URL. Real-time collaboration with client-side encryption and zero tracking.
  </text>

  <!-- Room URL Input Simulation -->
  <g transform="translate(370, 295)">
    <rect width="460" height="46" rx="8" fill="#0d0d0d" stroke="#282828" stroke-width="1.5"/>
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#777777">codeshift /</text>
    <text x="125" y="28" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff">my-room</text>
    <rect x="375" y="5" width="80" height="36" rx="6" fill="#ffffff"/>
    <text x="415" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Open →</text>
  </g>

  <!-- Monaco Real-Time Collaboration Simulation Window -->
  <g transform="translate(260, 365)">
    <!-- Terminal window container -->
    <rect width="680" height="185" rx="10" fill="#0d0d0d" stroke="#222222" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Window header bar -->
    <rect width="680" height="30" rx="10" fill="#141414"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="15" r="5" fill="#10b981"/>
    <text x="80" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#777777">main.ts — CodeShift Collaborative Buffer</text>
    <rect x="580" y="6" width="85" height="18" rx="4" fill="#000000" stroke="#333333"/>
    <circle cx="590" cy="15" r="3" fill="#10b981"/>
    <text x="600" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#ffffff">2 ONLINE</text>

    <!-- Code Line 1 -->
    <text x="24" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#555555">1</text>
    <text x="48" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#666666">// Client-side encrypted peer synchronization</text>

    <!-- Code Line 2 with Active Remote Cursor (User B) -->
    <rect x="40" y="73" width="620" height="22" fill="#10b981" fill-opacity="0.12"/>
    <text x="24" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#555555">2</text>
    <text x="48" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
      <tspan fill="#f43f5e">export const </tspan><tspan fill="#38bdf8">session </tspan><tspan fill="#e2e8f0">= </tspan><tspan fill="#f43f5e">await </tspan><tspan fill="#a855f7">CodeShift</tspan><tspan fill="#e2e8f0">.</tspan><tspan fill="#38bdf8">join</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#10b981">"my-room"</tspan><tspan fill="#e2e8f0">);</tspan>
    </text>
    <!-- Remote Cursor Badge (Anonymous 17) matching screenshot 3 -->
    <g transform="translate(425, 68)">
      <rect x="0" y="0" width="100" height="18" rx="4" fill="#10b981"/>
      <text x="50" y="13" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#000000" text-anchor="middle">Anonymous 17</text>
      <rect x="0" y="18" width="2" height="16" fill="#10b981"/>
    </g>

    <!-- Code Line 3 -->
    <text x="24" y="116" font-family="'JetBrains Mono', monospace" font-size="12" fill="#555555">3</text>
    <text x="48" y="116" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
      <tspan fill="#38bdf8">session</tspan><tspan fill="#e2e8f0">.</tspan><tspan fill="#38bdf8">onSync</tspan><tspan fill="#e2e8f0">(({ </tspan><tspan fill="#f59e0b">code</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#f59e0b">cursor</tspan><tspan fill="#e2e8f0"> }) =&gt; </tspan><tspan fill="#38bdf8">renderLive</tspan><tspan fill="#e2e8f0">(code));</tspan>
    </text>

    <!-- Code Line 4 -->
    <text x="24" y="144" font-family="'JetBrains Mono', monospace" font-size="12" fill="#555555">4</text>
    <text x="48" y="144" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
      <tspan fill="#666666">// Zero logins required · MIT Open Source</tspan>
    </text>
    <rect x="360" y="132" width="8" height="15" fill="#7ce2ee"/>
  </g>

  <!-- Minimal Black & White Footer Bar Simulation -->
  <g transform="translate(0, 580)">
    <rect width="1200" height="50" fill="#000000" stroke="#1f1f1f" stroke-width="1"/>
    <text x="60" y="30" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CodeShift v2.0</text>
    <text x="160" y="30" font-family="-apple-system, sans-serif" font-size="11.5" fill="#888888">Zero logins, zero tracking, client-encrypted storage</text>
    <text x="600" y="30" font-family="-apple-system, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Developed &amp; maintained with <tspan fill="#ff3b30">❤️</tspan> by <tspan font-weight="700" fill="#ffffff">Kaushal</tspan></text>
    
    <rect x="1040" y="12" width="100" height="26" rx="5" fill="#000000" stroke="#ffffff"/>
    <text x="1090" y="29" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GITHUB ↗</text>
  </g>
</svg>

